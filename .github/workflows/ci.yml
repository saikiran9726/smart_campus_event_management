name: Eventora CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test-and-verify:
    name: Build, Lint, Test & E2E (Desktop + Mobile)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eventora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/eventora_test
      DATABASE_SSL: "false"
      DATABASE_POOL_MAX: 10
      PORT: 4000
      PUBLIC_WEB_URL: http://localhost:5173
      PUBLIC_API_URL: http://localhost:4000
      VITE_API_URL: http://localhost:4000
      PAYMENT_MODE: sandbox
      CLERK_PUBLISHABLE_KEY: pk_test_ci_dummy_publishable_key
      CLERK_SECRET_KEY: sk_test_ci_dummy_secret_key_at_least_32_chars
      CLERK_WEBHOOK_SECRET: whsec_dGVzdHNlY3JldDEyMzQ1Njc4OWFiY2RlZg==
      VITE_CLERK_PUBLISHABLE_KEY: pk_test_ci_dummy_publishable_key
      MAGIC_LINK_SECRET: ci_test_magic_link_secret_at_least_32_chars_long
      OD_SEAL_SECRET: ci_test_od_seal_secret_at_least_32_chars_long
      OD_SEAL_SECRET_PREVIOUS: ""
      R2_ACCOUNT_ID: ci_dummy_r2_account_id
      R2_ACCESS_KEY_ID: ci_dummy_r2_access_key_id
      R2_SECRET_ACCESS_KEY: ci_dummy_r2_secret_access_key
      R2_BUCKET: eventora-assets
      R2_PUBLIC_BASE_URL: https://assets.eventora.campus.edu
      RESEND_API_KEY: ""
      MAIL_FROM: Eventora <events@eventora.campus.edu>
      EMAIL_PROVIDER: console
      WHATSAPP_PROVIDER: console
      META_WA_TOKEN: ""
      META_WA_PHONE_ID: ""
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      VITE_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      INITIAL_ADMIN_EMAILS: admin@eventora.campus.edu
      ALLOW_DEMO_SEED: "true"
      ALLOW_HTTP_WEB_URL: "true"
      ALLOW_TEST_AUTH_BYPASS: "true"
      GIT_SHA: test-ci

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Shared Package
        run: pnpm --filter @eventora/shared build

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo "Waiting for PostgreSQL..."
            sleep 1
          done
          echo "PostgreSQL is ready!"

      - name: Run Database Migrations
        run: pnpm --filter @eventora/api db:migrate

      - name: Verify Migration Idempotency on Clean Database
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "DROP DATABASE IF EXISTS eventora_empty_ci;"
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE eventora_empty_ci;"
          DATABASE_URL="postgres://postgres:postgres@localhost:5432/eventora_empty_ci" pnpm --filter @eventora/api db:migrate
          DATABASE_URL="postgres://postgres:postgres@localhost:5432/eventora_empty_ci" pnpm --filter @eventora/api db:migrate
          PGPASSWORD=postgres psql -h localhost -U postgres -c "DROP DATABASE eventora_empty_ci;"

      - name: Seed Database
        run: pnpm --filter @eventora/api db:seed

      - name: Invariant Gate (Zero Placeholders)
        run: |
          ! git grep -InE "TODO|FIXME|not implemented|rest of implementation" -- apps packages scripts e2e && echo "NO PLACEHOLDERS FOUND"

      - name: Workspace Typecheck
        run: pnpm typecheck

      - name: Workspace Lint
        run: pnpm lint

      - name: Workspace Build
        run: pnpm -r build

      - name: Route & Realtime Parity Audit
        run: node scripts/route-audit.mjs

      - name: Unit & Integration Tests
        run: pnpm -r test

      - name: Concurrency Engine ACID Trials
        run: pnpm --filter @eventora/api test:concurrency

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright E2E Tests (Chromium & Pixel 5)
        run: pnpm exec playwright test e2e/volunteer-passkey.spec.ts --project="chromium" --project="Pixel 5"

      - name: Evidence-Based Playwright Crawl (Non-blocking)
        continue-on-error: true
        run: pnpm playwright test e2e/crawl.spec.ts --project="chromium"

      - name: Upload Crawl Report & Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawl-report
          path: |
            docs/CRAWL-REPORT.md
            test-results/crawl/

  build-containers:
    name: Build & Verify Production Container Images
    runs-on: ubuntu-latest
    needs: test-and-verify

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: eventora-api:latest

      - name: Build Web Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: eventora-web:latest
          build-args: |
            VITE_API_URL=https://eventora-api-demo.onrender.com
            VITE_CLERK_PUBLISHABLE_KEY=pk_test_placeholder_key_here
            VITE_TURNSTILE_SITE_KEY=1x00000000000000000000AA

