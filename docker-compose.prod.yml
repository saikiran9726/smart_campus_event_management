version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: eventora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eventora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-eventora}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-eventora} -d $${POSTGRES_DB:-eventora}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - eventora-internal

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: eventora-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.production
    expose:
      - "4000"
    deploy:
      replicas: 1
    networks:
      - eventora-internal

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: eventora-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - api
    networks:
      - eventora-internal

volumes:
  postgres_data:
    name: eventora_postgres_data

networks:
  eventora-internal:
    driver: bridge
    internal: false
