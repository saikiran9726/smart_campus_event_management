services:
  # Eventora API Backend (Docker Web Service)
  - type: web
    name: eventora-api
    env: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    numInstances: 1
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: PAYMENT_MODE
        value: sandbox
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_POOL_MAX
        value: "10"
      - key: DATABASE_URL
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_WEBHOOK_SECRET
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: eventora-assets
      - key: R2_PUBLIC_BASE_URL
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: Eventora <events@eventora.campus.edu>
      - key: WHATSAPP_PROVIDER
        value: console
      - key: META_WA_TOKEN
        sync: false
      - key: META_WA_PHONE_ID
        sync: false
      - key: MAGIC_LINK_SECRET
        sync: false
      - key: OD_SEAL_SECRET
        sync: false
      - key: OD_SEAL_SECRET_PREVIOUS
        sync: false
      - key: PUBLIC_WEB_URL
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: INITIAL_ADMIN_EMAILS
        sync: false
      - key: ALLOW_DEMO_SEED
        value: "false"

  # Eventora Web Frontend (Static Site Service)
  - type: web
    name: eventora-web
    env: static
    plan: free
    region: oregon
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @eventora/shared build && pnpm --filter @eventora/web build
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: VITE_TURNSTILE_SITE_KEY
        sync: false
